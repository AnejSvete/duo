defaults:
  - _self_
  - /callbacks: [checkpoint_every_n_steps, checkpoint_monitor, learning_rate_monitor, early_stopping, reduce_lr_on_plateau, curriculum_learning, auto_recovery]
  - /data: formal_language
  - /model: nano
  - /strategy: ddp
  - /noise: log-linear
  - /lr_scheduler: warmup_stable_decay
  - /algo: mdlm

mode: train  # train / prepare_data / ppl_eval / sample_eval

seed: 2

loader:
  global_batch_size: 2048
  eval_global_batch_size: ${.global_batch_size}
  # Note: batch_size and eval_batch_size are **per machine**
  batch_size: 2048
  eval_batch_size: 2048
  num_workers: ${eval:"len(__import__('os').sched_getaffinity(0))"}
  pin_memory: True

sampling:
  predictor: ancestral_cache  # ancestral_cache (only for MDLM), ancestral, analytic
  steps: 1000
  noise_removal: ancestral  # 'ancestral', 'greedy', 'none'
  use_float64: True
  p_nucleus: 1.0
  num_sample_batches: 2  # Total samples: `num_gpus` * `loader.eval_batch_size` * num_sample_batches
  num_sample_log: 4
  semi_ar: False
  stride_length: 1
  num_strides: 1

training:
  antithetic_sampling: True
  sampling_eps: 1e-3
  finetune_path: ''
  ground_truth_masking: True

curriculum:
  enabled: true  # Enable curriculum learning
  num_bins: 4  # Number of length bins to divide training into
  epochs_per_bin: 4  # Number of epochs to train on each length bin
  overlap: 0.2  # Overlap ratio between consecutive bins (0-1)
  min_batches_per_epoch: 1  # Minimum batches per epoch (auto-expands range if needed)
  min_examples_per_bin: 512  # Minimum examples per bin (bins with fewer are skipped)
  use_quantiles: true  # Use quantiles for bin boundaries (true) or uniform ranges (false)
  sample_size: 1000  # Number of examples to sample when estimating dataset length
  sample_strategy: "linspace"  # Sampling strategy: "linspace" or "random"
  exact_percentiles: true  # Use exact percentiles (slower but more accurate)

eval:
  checkpoint_path: ''  # Used to evaluate a checkpoint after training.
  compute_generative_perplexity: False
  perplexity_batch_size: 8
  compute_perplexity_on_sanity: False
  gen_ppl_eval_model_name_or_path: gpt2-large  # gpt2-large, meta-llama/Llama-2-7b-hf
  generate_samples: True
  generated_samples_path: ${cwd:}/samples.json
  top_k: 4

optim:
  weight_decay: 0.1
  lr: 5e-3
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8

trainer:
  _target_: lightning.Trainer
  accelerator: cuda
  num_nodes: 1
  devices: ${device_count:}
  accumulate_grad_batches: 1
  gradient_clip_val: 10.0
  num_sanity_val_steps: 2
  max_steps: 10000
  log_every_n_steps: 10
  limit_train_batches: 1.0   # train on full dataset, can be used to toggle quick run
  limit_val_batches: 1.0     # validate on full dataset, can be used to toggle quick run
  val_check_interval: 0.25

wandb:
  project: mdm-expressivity
  notes: Computational expressivity of MDMs
  group: null
  job_type: null
  name: ${now:%Y%m%d_%H%M%S}
  id: ${.name}_${seed}
  tags:
    - ${noise.type}
    - ${data.language}
    - ${algo.name}

hydra:
  run:
    dir: /cluster/scratch/asvete/duo/outputs/${data.language}/${now:%Y.%m.%d}/${now:%H%M%S}
  job:
    chdir: true

checkpointing:
  # Use custom `save_dir` if, e.g., saving to S3 bucket, otherwise leave this parameter as is
  save_dir: ${cwd:}
  # Note: `checkpoints` path should correspond to `checkpoint_every_n_steps.dirpath`
  resume_from_ckpt: true
  resume_ckpt_path: ${.save_dir}/checkpoints/last.ckpt
