cache_dir: /cluster/scratch/asvete/duo
language: null

properties:
  num_examples_train: 100
  num_examples_valid: 10
  num_examples_test: 10
  min_train_len: 2
  max_train_len: 10
  min_val_len: 5
  max_val_len: 10
  min_test_len: 5
  max_test_len: 10
  format: trace

  # Padding configuration - controls extra empty padding beyond natural trace
  padding_scale_type: linear  # Options: natural, linear, quadratic, cubic, constant
  padding_multiplier: 1.0  # Scaling factor for extra padding (0.0 = no extra padding)
  padding_constant: null  # Fixed number of extra PAD tokens (for constant mode)
  padding_max: 512  # Optional cap on extra padding length
