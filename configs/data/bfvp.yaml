defaults:
  - formal_language

language: bfvp
properties:
  num_vars: 2

  # Depth ranges for train/val/test splits
  # Depth controls problem difficulty and correlates strongly with sequence length
  # Approximate length mapping (num_vars=2, trace format):
  #   Depth 1: ~3-5 tokens,  Depth 2: ~7-12 tokens,  Depth 3: ~15-24 tokens
  #   Depth 4: ~33-47 tokens, Depth 5: ~68-92 tokens, Depth 6: ~145-173 tokens
  min_train_depth: 1
  max_train_depth: 4
  min_val_depth: 2
  max_val_depth: 5
  min_test_depth: 3
  max_test_depth: 6