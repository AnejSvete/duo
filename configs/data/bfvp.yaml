defaults:
  - formal_language

language: bfvp
properties:
  num_vars: 2

  # Depth ranges for train/val/test splits
  # Depth controls problem difficulty and correlates strongly with sequence length
  # Approximate length mapping (num_vars=2, trace format):
  #   Depth 1: ~3-5 tokens,  Depth 2: ~7-12 tokens,  Depth 3: ~15-24 tokens
  #   Depth 4: ~33-47 tokens, Depth 5: ~68-92 tokens, Depth 6: ~145-173 tokens
  min_train_depth: 1
  max_train_depth: 6
  min_val_depth: 3
  max_val_depth: 6
  min_test_depth: 3
  max_test_depth: 6

  # Length ranges (approximate, based on depth mapping above)
  # Used for curriculum learning and length-based filtering
  min_train_len: 3
  max_train_len: 128
  min_val_len: 64
  max_val_len: 128
  min_test_len: 64
  max_test_len: 128