defaults:
  - formal_language

language: arithmetic
properties:
  min_val: 1
  max_val: 50

  # Depth ranges for train/val/test splits
  # Depth controls expression complexity and correlates with sequence length
  # Larger depth values create deeper expression trees with more operations
  min_train_depth: 1
  max_train_depth: 4
  min_val_depth: 3
  max_val_depth: 5
  min_test_depth: 4
  max_test_depth: 6

  # Length ranges (approximate, based on expression depth)
  # Used for curriculum learning and length-based filtering
  # Depth 1: ~5-8 tokens, Depth 2: ~10-15 tokens, Depth 3: ~20-30 tokens
  # Depth 4: ~40-60 tokens, Depth 5: ~80-120 tokens, Depth 6: ~160-240 tokens
  min_train_len: 5
  max_train_len: 60
  min_val_len: 20
  max_val_len: 120
  min_test_len: 40
  max_test_len: 240