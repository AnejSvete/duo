early_stopping:
  _target_: lightning.pytorch.callbacks.EarlyStopping
  monitor: "val/acc_token"
  patience: 24  # Increased from 8 to allow LR reduction to take effect (3x the ReduceLROnPlateau patience)
  min_delta: 0.005  # Reduced from 0.01 to be more sensitive to smaller improvements
  mode: "max"
  verbose: true           